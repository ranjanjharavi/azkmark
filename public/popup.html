<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>azkmark</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/shared.css" />
    <link rel="stylesheet" href="styles/popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body data-page="popup">
    <main>
      <h1>azkmark</h1>
      <p id="page-status" role="status">Reading the current page…</p>
      <form id="save-form" novalidate>
        <section id="page-details" aria-label="Current page" hidden>
          <label for="page-title">Title</label>
          <textarea id="page-title" name="title" rows="2" required aria-describedby="title-error"></textarea>
          <p id="title-error" role="alert" hidden>Enter a title</p>
          <a id="page-url" target="_blank" rel="noopener noreferrer"></a>
          <img id="page-image" alt="" referrerpolicy="no-referrer" hidden />
          <p id="preview-status" role="status">Checking for a thumbnail…</p>
          <label for="save-to">Save to</label>
          <select id="save-to" class="collection-select" aria-describedby="save-to-error" disabled><option value="">Unsorted</option></select>
          <p id="save-to-error" role="alert" hidden></p>
          <div class="tag-entry">
            <label for="page-tag">Tags (optional)</label>
            <div class="tag-input-row">
              <input id="page-tag" type="text" list="page-tag-options" autocomplete="off" spellcheck="false" aria-describedby="page-tag-help page-tag-error" placeholder="Add a tag" />
              <button id="page-tag-add" type="button">Add tag</button>
            </div>
            <datalist id="page-tag-options"></datalist>
            <p id="page-tag-help" class="tag-help">Up to 32 tags, 80 characters each. Labels are lowercased; whitespace collapses. Commas stay inside a tag. Save includes pending text.</p>
            <p id="page-tag-error" class="tag-error" role="alert" hidden></p>
            <ul id="page-tags" class="tag-drafts" aria-label="Draft tags" hidden></ul>
            <p id="page-tag-status" class="visually-hidden" role="status" aria-atomic="true"></p>
          </div>
        </section>
        <div class="popup-actions">
          <button id="save" type="submit" disabled>Save</button>
          <button id="open-library" type="button">Open library</button>
        </div>
      </form>
      <p id="save-status" role="status" aria-atomic="true"></p>
      <p id="save-error" role="alert" hidden></p>
      <p id="feedback" role="alert" hidden></p>
    </main>
  </body>
</html>
